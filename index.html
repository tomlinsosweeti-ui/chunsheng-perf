<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>春盛二团 绩效考核系统</title>
<style>
:root {
  --bg: #f0f4fc; --card: #fff; --primary: #4361ee; --primary-light: #eef1ff; --primary-dark: #3a56d4;
  --danger: #e63946; --danger-light: #fef0ef; --danger-dark: #c1121f;
  --success: #2a9d8f; --success-light: #e8f8f5; --success-dark: #1e7a6f;
  --warning: #f4a261; --warning-light: #fef6ee;
  --text: #1a2235; --text2: #6b7a90; --text3: #9aa5b5;
  --border: #e3e8f0; --radius: 12px; --shadow: 0 2px 20px rgba(67,97,238,.08);
  --red-bg: #fef0ef; --green-bg: #eafaf1; --blue-bg: #eef1ff; --orange-bg: #fef5e7;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:14px}

.header{background:linear-gradient(135deg, #4361ee 0%, #3a0caa 100%);color:#fff;padding:16px 28px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;box-shadow:0 2px 12px rgba(67,97,238,.25)}
.header h1{font-size:20px;font-weight:700;letter-spacing:.5px}
.header .date{font-size:13px;opacity:.85;margin-top:2px}

.tabs{display:flex;background:var(--card);border-bottom:1px solid var(--border);padding:0 24px;gap:2px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.tab{padding:14px 22px;font-size:14px;font-weight:500;cursor:pointer;color:var(--text2);border-bottom:2.5px solid transparent;white-space:nowrap;transition:color .15s,background .15s,border-color .15s;border-radius:8px 8px 0 0;user-select:none}
.tab:hover{background:var(--primary-light);color:var(--primary)}
.tab.active{color:var(--primary);border-bottom-color:var(--primary);background:var(--primary-light)}

.main{max-width:1200px;margin:0 auto;padding:20px 16px}

.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;margin-bottom:16px;border:1px solid var(--border)}
.card h3{font-size:15px;margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;font-weight:600}

.btn{padding:7px 18px;border:none;border-radius:8px;font-size:13px;font-weight:500;cursor:pointer;transition:background .12s,box-shadow .12s,color .12s;white-space:nowrap;font-family:inherit;outline:none}
.btn:active{transform:scale(.96)}
.btn-primary{background:var(--primary);color:#fff;box-shadow:0 2px 8px rgba(67,97,238,.25)}
.btn-primary:hover{background:var(--primary-dark);box-shadow:0 4px 12px rgba(67,97,238,.35)}
.btn-outline{background:none;border:1px solid var(--border);color:var(--text);border-radius:8px}
.btn-outline:hover{border-color:var(--primary);color:var(--primary);background:var(--primary-light)}
.btn-danger{background:var(--danger);color:#fff}
.btn-danger:hover{background:var(--danger-dark)}
.btn-success{background:var(--success);color:#fff}
.btn-success:hover{background:var(--success-dark)}
.btn-sm{padding:5px 14px;font-size:12px}
.btn-xs{padding:3px 10px;font-size:11px;border-radius:6px}

input,select,textarea{
  padding:8px 14px;border:1.5px solid var(--border);border-radius:8px;
  font-size:13px;outline:none;font-family:inherit;transition:border .2s,box-shadow .2s;background:#fff;
}
input:focus,select:focus,textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(67,97,238,.1)}
textarea{resize:vertical;min-height:50px;width:100%}

table{width:100%;border-collapse:collapse;font-size:13px}
th{
  text-align:left;padding:11px 14px;font-weight:600;color:var(--text2);font-size:12px;
  border-bottom:2px solid var(--primary);background:var(--blue-bg);
}
td{padding:10px 14px;border-bottom:1px solid #f0f2f5}
tr:hover td{background:#f8f9fc}
tr:nth-child(even) td{background:#fafbfd}

.flex{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.flex-between{display:flex;justify-content:space-between;align-items:center}
.gap-sm{gap:6px}.gap-md{gap:14px}
.mt-sm{margin-top:8px}.mt-md{margin-top:16px}.mb-sm{margin-bottom:6px}.mb-md{margin-bottom:14px}
.text-sm{font-size:12px;color:var(--text2)}
.text-center{text-align:center}
.badge{display:inline-block;padding:3px 8px;border-radius:5px;font-size:11px;font-weight:600;letter-spacing:.3px}
.badge-p0{background:#fde8e8;color:#c1121f}.badge-p1{background:var(--blue-bg);color:var(--primary)}
.badge-p2{background:var(--green-bg);color:#1a7a6f}.badge-p3{background:var(--orange-bg);color:#e67e22}.badge-p4{background:#f4ecf7;color:#7b2d8b}

.score-high{color:var(--success)}.score-mid{color:var(--warning)}.score-low{color:var(--danger)}
.progress-bar{height:8px;border-radius:4px;background:var(--border);overflow:hidden;margin-top:4px}
.progress-bar .fill{height:100%;border-radius:4px;transition:width .4s ease}

.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.stat-card{
  text-align:center;padding:18px 14px;border-radius:10px;
  background:linear-gradient(135deg, #f8f9fc, #fff);border:1px solid var(--border);
  transition:box-shadow .15s,transform .15s;
}
.stat-card:hover{box-shadow:0 4px 16px rgba(0,0,0,.06);transform:translateY(-1px)}
.stat-card .number{font-size:32px;font-weight:800;line-height:1.1}
.stat-card .label{font-size:12px;color:var(--text2);margin-top:4px;font-weight:500}

.date-picker{
  padding:7px 12px;border:1.5px solid rgba(255,255,255,.4);border-radius:8px;
  background:rgba(255,255,255,.12);color:#fff;font-size:13px;outline:none;
  cursor:pointer;font-family:inherit;transition:background .12s,color .12s;
}
.date-picker::-webkit-calendar-picker-indicator{filter:invert(1);cursor:pointer;opacity:.8}
.date-picker:hover{border-color:rgba(255,255,255,.7);background:rgba(255,255,255,.2)}

.modal-overlay{
  position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.45);
  display:flex;align-items:center;justify-content:center;z-index:100;
  animation:fadeIn .2s ease;
}
.modal{
  background:#fff;border-radius:14px;padding:24px;max-width:560px;width:92%;
  max-height:82vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.18);
  animation:slideUp .25s ease;
}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}

/* ====== SCORING PAGE ====== */
.scoring-layout{display:grid;grid-template-columns:1fr 400px;gap:18px;align-items:start}

.person-chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0;flex-wrap:wrap}
.person-chip{
  padding:7px 16px;border-radius:22px;font-size:13px;font-weight:500;cursor:pointer;
  border:2px solid var(--border);background:#fff;transition:border-color .12s,box-shadow .12s,transform .12s;white-space:nowrap;
  display:inline-flex;align-items:center;gap:7px;user-select:none;
}
.person-chip:hover{border-color:var(--primary);box-shadow:0 2px 8px rgba(67,97,238,.15)}
.person-chip.active{border-color:var(--primary);background:var(--primary-light);color:var(--primary);box-shadow:0 2px 10px rgba(67,97,238,.18)}
.person-chip .delta{font-size:11px;padding:1px 7px;border-radius:9px;font-weight:700}
.person-chip .delta.plus{background:var(--green-bg);color:var(--success)}
.person-chip .delta.minus{background:var(--red-bg);color:var(--danger)}
.person-chip .delta.zero{background:#f5f5f5;color:var(--text3)}

.score-header{
  display:flex;align-items:center;justify-content:space-between;padding:14px 18px;
  background:linear-gradient(135deg, var(--blue-bg), #f0f4fc);border-radius:var(--radius);
  margin-bottom:14px;border:1px solid #dbeafe;
}
.score-header .current-score{font-size:24px;font-weight:800}
.score-header .score-diff{font-size:13px;padding:4px 12px;border-radius:8px;font-weight:600}
.score-header .score-diff.plus{background:#d5f5e3;color:var(--success)}
.score-header .score-diff.minus{background:#fadbd8;color:var(--danger)}
.score-header .score-diff.zero{background:#eaecee;color:var(--text2)}

.cat-tabs{display:flex;gap:5px;margin-bottom:10px;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch}
.cat-tab{padding:5px 14px;border-radius:18px;font-size:12px;cursor:pointer;border:1px solid var(--border);background:#fff;white-space:nowrap;transition:background .12s,color .12s,border-color .12s;font-weight:500;user-select:none}
.cat-tab:hover{border-color:var(--primary);color:var(--primary)}
.cat-tab.active{background:var(--primary);color:#fff;border-color:var(--primary);box-shadow:0 2px 8px rgba(67,97,238,.2)}

.scoring-item{
  display:grid;grid-template-columns:1fr 76px 104px 74px;gap:14px;align-items:center;
  padding:12px 14px;border-radius:10px;margin-bottom:6px;
  transition:border-color .12s,box-shadow .12s,background .12s;
  box-shadow:0 1px 3px rgba(0,0,0,.04);
}
.scoring-item:hover{background:#f8f9fc;border-color:#e5e7eb;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.scoring-item.scored-today{position:relative}
.scoring-item.scored-today::before{content:'';position:absolute;left:0;top:12px;bottom:12px;width:3px;background:var(--success);border-radius:0 2px 2px 0;opacity:.6}
.scoring-item-header{
  display:grid;grid-template-columns:1fr 76px 104px 74px;gap:14px;align-items:center;
  padding:0 14px 8px;font-size:11px;font-weight:700;color:#6b7280;
  border-bottom:1.5px solid var(--border);margin-bottom:8px;
}
.scoring-item .item-info{font-size:12.5px;line-height:1.55}
.scoring-item .item-info .std{color:var(--text2);font-size:11px;margin-top:2px}
.scoring-item .item-score-badge{
  text-align:center;font-size:13px;font-weight:700;
  border-radius:10px;padding:5px 0;min-width:60px;
  display:inline-flex;align-items:center;justify-content:center;
  font-variant-numeric:tabular-nums;
}
.scoring-item .item-score-badge.neg{background:#fee2e2;color:var(--danger);border:1px solid #fca5a5}
.scoring-item .item-score-badge.pos{background:#dcfce7;color:#15803d;border:1px solid #86efac}
.scoring-item .input-wrap{position:relative;display:flex;align-items:center;justify-content:center}
.scoring-item .score-input{
  width:92px;padding:7px 8px;border:2px solid var(--border);border-radius:8px;
  font-size:14px;font-weight:700;text-align:center;outline:none;
  transition:border-color .15s,box-shadow .15s,background .15s;
  background:#fafafa;font-variant-numeric:tabular-nums;
}
.scoring-item .score-input:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(67,97,238,.12);background:#fff}
.scoring-item .score-input.negative{border-color:var(--danger);background:#fff5f5;color:var(--danger)}
.scoring-item .score-input.negative:focus{border-color:var(--danger);box-shadow:0 0 0 3px rgba(230,57,70,.12)}
.scoring-item .score-input.positive{border-color:var(--success);background:#f0fdf4;color:var(--success)}
.scoring-item .score-input.positive:focus{border-color:var(--success);box-shadow:0 0 0 3px rgba(42,157,143,.12)}
.scoring-item .score-input.zero{border-color:var(--border);background:#fafafa;color:var(--text)}
.scoring-item .score-input.edited{border-style:dashed}
.scoring-item .score-btn{
  padding:7px 14px;border:none;border-radius:8px;font-size:13px;font-weight:600;
  cursor:pointer;transition:color .12s,background .12s,border-color .12s;white-space:nowrap;
  background:#e5e7eb;color:#6b7280;font-family:inherit;outline:none;
}
.scoring-item .score-btn:active{transform:scale(.95)}
.scoring-item .score-btn.active-pos{background:var(--success);color:#fff;box-shadow:0 2px 8px rgba(42,157,143,.25)}
.scoring-item .score-btn.active-neg{background:var(--danger);color:#fff;box-shadow:0 2px 8px rgba(230,57,70,.25)}
.scoring-item .score-btn:hover{opacity:.88}
.scoring-item .today-badge{
  display:inline-block;min-width:18px;height:18px;line-height:18px;border-radius:9px;
  font-size:10px;font-weight:700;text-align:center;background:var(--primary);color:#fff;
  position:absolute;top:-8px;right:-8px;
}

.empty-state{text-align:center;padding:40px 20px;color:var(--text2)}
.today-log-item{
  display:flex;align-items:flex-start;gap:8px;padding:9px 0;border-bottom:1px solid #f2f2f2;font-size:12px;
  transition:background .1s;
}
.today-log-item:hover{background:#f8f9fc}
.today-log-item .log-badge{padding:2px 7px;border-radius:5px;font-size:10px;font-weight:600;white-space:nowrap;min-width:36px;text-align:center}
.today-log-item .log-badge.neg{background:var(--red-bg);color:var(--danger)}
.today-log-item .log-badge.pos{background:var(--green-bg);color:var(--success)}

.batch-bar{
  background:linear-gradient(135deg, #fffbeb, #fef9c3);border:1px solid #fde68a;
  border-radius:8px;padding:10px 16px;margin-bottom:12px;
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:13px;
}

/* ====== MONTH CALENDAR TABLE ====== */
.calendar-card{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:var(--radius);border:1px solid var(--border);background:#fff}
.calendar-table{min-width:100%;border-collapse:separate;border-spacing:0;font-size:12px;white-space:nowrap}
.calendar-table th,.calendar-table td{text-align:center;padding:8px 6px;border-bottom:1px solid var(--border);border-right:1px solid #f0f2f5}
.calendar-table thead th{position:sticky;top:0;background:var(--blue-bg);z-index:2;font-weight:600;color:var(--text2)}
.calendar-table thead th:first-child{position:sticky;left:0;z-index:3;background:var(--blue-bg)}
.calendar-table tbody th{position:sticky;left:0;background:#fff;z-index:1;text-align:left;font-weight:600;border-right:1px solid var(--border);min-width:90px}
.calendar-table tbody tr:hover td{background:#f8f9fc}
.calendar-table tbody tr:hover th{background:#f0f4fc}
.calendar-table .day-cell{min-width:34px;height:34px;display:flex;align-items:center;justify-content:center;border-radius:6px;margin:0 auto;cursor:pointer;font-weight:700;font-variant-numeric:tabular-nums;transition:background .12s,transform .12s,box-shadow .12s}
.calendar-table .day-cell:hover{transform:scale(1.12);box-shadow:0 2px 8px rgba(0,0,0,.12)}
.calendar-table .day-cell.pos{background:var(--green-bg);color:var(--success-dark)}
.calendar-table .day-cell.neg{background:var(--red-bg);color:var(--danger-dark)}
.calendar-table .day-cell.zero{background:#f5f6f8;color:var(--text3)}
.calendar-table .day-cell.empty{background:transparent;color:var(--text3);cursor:default}
.calendar-table .day-cell.empty:hover{transform:none;box-shadow:none}
.calendar-table .weekend{background:#fafbfd}
.calendar-table .today-col{background:#fffbeb}
.calendar-switch{display:flex;gap:8px;margin-bottom:12px;align-items:center;flex-wrap:wrap}
.calendar-switch .switch-btn{padding:5px 14px;border-radius:20px;border:1px solid var(--border);background:#fff;font-size:12px;cursor:pointer;font-weight:500;transition:background .12s,color .12s,border-color .12s}
.calendar-switch .switch-btn:hover{border-color:var(--primary);color:var(--primary)}
.calendar-switch .switch-btn.active{background:var(--primary);color:#fff;border-color:var(--primary)}

@media(max-width:900px){
  .scoring-layout{grid-template-columns:1fr}
  .grid-4{grid-template-columns:1fr 1fr}
  .header{background:linear-gradient(135deg, #4361ee 0%, #3a0caa 100%);color:#fff;padding:16px 28px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;box-shadow:0 2px 12px rgba(67,97,238,.25)}
  .calendar-table th,.calendar-table td{padding:6px 4px;font-size:11px}
}
@media(max-width:600px){
  .main{padding:12px 8px}
  .card{padding:14px}
  .stat-card .number{font-size:24px}
}

.sync-status{font-size:12px;padding:4px 12px;border-radius:20px;white-space:nowrap;transition:background .25s,color .25s}
.sync-status.loading{background:rgba(255,255,255,.2);color:#fff}
.sync-status.syncing{background:#f4a261;color:#fff}
.sync-status.synced{background:#2a9d8f;color:#fff}
.sync-status.updated{background:#4361ee;color:#fff}
.sync-status.error{background:#e63946;color:#fff}

/* ====== TOAST ====== */
.toast-container{position:fixed;top:20px;right:20px;z-index:200;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{padding:12px 20px;border-radius:10px;font-size:13px;font-weight:600;color:#fff;box-shadow:0 8px 30px rgba(0,0,0,.18);animation:toastIn .3s cubic-bezier(.16,1,.3,1),toastOut .3s cubic-bezier(.16,1,.3,1) 2s forwards;pointer-events:auto;max-width:360px}
.toast.success{background:var(--success)}
.toast.error{background:var(--danger)}
.toast.info{background:var(--primary)}
@keyframes toastIn{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:translateX(0)}}
@keyframes toastOut{from{opacity:1;transform:translateX(0)}to{opacity:0;transform:translateX(40px)}}

/* ====== STICKY HEADER & PAGE TRANSITION ====== */
.header{position:sticky;top:0;z-index:50}
.tabs{position:sticky;top:var(--header-height,56px);z-index:49}
.main-wrap{animation:pageIn .22s cubic-bezier(.16,1,.3,1)}
@keyframes pageIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}

/* ====== CONFIRM DIALOG ====== */
.confirm-backdrop{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.45);z-index:150;display:flex;align-items:center;justify-content:center;animation:fadeIn .2s ease}
.confirm-box{background:#fff;border-radius:14px;padding:28px 32px;max-width:420px;width:90%;box-shadow:0 20px 60px rgba(0,0,0,.2);animation:slideUp .25s ease;text-align:center}
.confirm-box .confirm-icon{font-size:40px;margin-bottom:10px}
.confirm-box .confirm-msg{font-size:15px;font-weight:600;color:var(--text);margin-bottom:4px}
.confirm-box .confirm-sub{font-size:12px;color:var(--text2);margin-bottom:20px}
.confirm-box .confirm-actions{display:flex;gap:10px;justify-content:center}

/* ====== SCORING SUCCESS PULSE ====== */
@keyframes scorePulse{0%{box-shadow:0 0 0 0 rgba(42,157,143,.5)}70%{box-shadow:0 0 0 14px rgba(42,157,143,0)}100%{box-shadow:0 0 0 0 rgba(42,157,143,0)}}
.scoring-item.flash-success{animation:scorePulse .6s ease;background:#eefbf4!important;border-color:#86d9bf!important}

/* ====== INPUT STEPPER ====== */
.score-input-wrap{display:flex;align-items:center;gap:0}
.score-input-wrap .step-btn{width:26px;height:32px;border:1.5px solid var(--border);background:#f8f9fc;font-size:14px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .1s,border-color .1s;user-select:none;line-height:1;color:var(--text2)}
.score-input-wrap .step-btn:hover{background:var(--primary-light);border-color:var(--primary);color:var(--primary)}
.score-input-wrap .step-btn:active{transform:scale(.92)}
.score-input-wrap .step-btn.minus{border-radius:8px 0 0 8px;border-right:none}
.score-input-wrap .step-btn.plus{border-radius:0 8px 8px 0;border-left:none}
.score-input-wrap .score-input{border-radius:0!important;width:52px!important;padding:7px 4px!important}
.score-input-wrap .score-input::-webkit-inner-spin-button,
.score-input-wrap .score-input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.score-input-wrap .score-input{-moz-appearance:textfield;appearance:textfield}

/* ====== CRITERIA COLLAPSE ====== */
.criteria-header{cursor:pointer;transition:color .12s,background .12s;user-select:none;display:flex;align-items:center;gap:4px}
.criteria-header:hover{background:var(--blue-bg);border-radius:8px;padding-left:6px;margin-left:-6px}
.criteria-header .collapse-arrow{display:inline-block;transition:transform .25s ease;font-size:11px}
.criteria-header.collapsed .collapse-arrow{transform:rotate(-90deg)}
.criteria-body{overflow:hidden;transition:max-height .4s ease}
.criteria-body.collapsed{max-height:0!important}

/* ====== TAB SLIDING INDICATOR ====== */
.tabs::after{content:'';position:absolute;bottom:0;left:var(--indicator-left,0px);width:var(--indicator-width,0px);height:2.5px;background:var(--primary);border-radius:3px 3px 0 0;transition:left .25s cubic-bezier(.4,0,.2,1),width .25s cubic-bezier(.4,0,.2,1);z-index:1}

/* ====== PERSON CHIP ENHANCED ====== */
.person-chip{transition:transform .15s,box-shadow .15s,border-color .15s,background .15s}
.person-chip.active{transform:scale(1.04)}
.person-chip:active{transform:scale(.94)}

/* ====== TODAY LOG EDIT ====== */
.today-log-item .log-actions{display:flex;gap:4px;align-items:center}
.edit-record-input{width:56px;padding:4px 6px;border:1.5px solid var(--primary);border-radius:6px;font-size:12px;font-weight:600;text-align:center;outline:none;background:#fff}

/* ====== RESPONSIVE ENHANCEMENTS ====== */
@media(max-width:600px){
  .scoring-item{grid-template-columns:1fr 56px 72px 56px;gap:6px;padding:10px 8px}
  .scoring-item-header{grid-template-columns:1fr 56px 72px 56px;gap:6px;font-size:10px}

const CloudDB = {
  async load() {
    const snapshot = await db.ref('perf').once('value');
    return snapshot.val() || { records: {}, people: JSON.parse(JSON.stringify(APP_DATA.people)) };
  },
  async save(data) {
    await db.ref('perf').set({ ...data, updatedAt: Date.now() });
  },
  listen(cb) {
    db.ref('perf').on('value', (snap) => { const d = snap.val(); d && cb(d); });
  }
};

let _saveTimer = null;
let _isRemoteUpdate = false;

// 防抖保存
function cloudSave() {
  setSyncStatus('syncing', '⏳ 同步中...');
  clearTimeout(_saveTimer);
  _saveTimer = setTimeout(async () => {
    try {
      await CloudDB.save({ records: state.records, people: state.people });
      setSyncStatus('synced', '✅ 已同步');
    } catch(e) {
      setSyncStatus('error', '❌ 同步失败');
      console.error('保存失败', e);
    }
  }, 1000);
}

function setSyncStatus(cls, text) {
  const el = document.getElementById('syncStatus');
  if (el) { el.className = 'sync-status ' + cls; el.textContent = text; }
}



// ====== TOAST ======
function showToast(msg, type) {
  type = type || 'info';
  var c = document.getElementById('toastContainer');
  var t = document.createElement('div');
  t.className = 'toast ' + type;
  t.textContent = msg;
  c.appendChild(t);
  setTimeout(function(){ t.remove(); }, 2500);
}

  return new Promise(function(resolve) {
    document.getElementById('confirmIcon').textContent = icon || '⚠️';
    document.getElementById('confirmMsg').textContent = msg;
    document.getElementById('confirmSub').textContent = sub || '';
    var okBtn = document.getElementById('confirmOk');
    okBtn.textContent = okText || '确认';
    okBtn.className = 'btn btn-sm';
    okBtn.classList.add(okClass || 'btn-danger');
    document.getElementById('confirmBackdrop').style.display = 'flex';
    function cleanup(v) {
      document.getElementById('confirmBackdrop').style.display = 'none';
      resolve(v);
    }
    document.getElementById('confirmOk').onclick = function(){ cleanup(true); };
    document.getElementById('confirmCancel').onclick = function(){ cleanup(false); };
    document.getElementById('confirmBackdrop').onclick = function(e){ if (e.target === this) cleanup(false); };
  });
}

const STORAGE_KEY = 'chunsheng_perf_v4';
let state = loadState();

let scoringCatFilter = '全部';

function loadState() {
  try {
    const s = localStorage.getItem(STORAGE_KEY);
    if (s) {
      const saved = JSON.parse(s);
      const defaultPeople = JSON.parse(JSON.stringify(APP_DATA.people));
      const savedMap = new Map((saved.people || []).map(p => [p.name, p]));
      saved.people = defaultPeople.map(p => {
        const savedP = savedMap.get(p.name);
        const merged = { ...p, note: savedP?.note || p.note };
        if (savedP?.level && APP_DATA.levels[savedP.level]) {
          merged.level = savedP.level;
        }
        return merged;
      });
      return saved;
    }
  } catch(e) {}
  return { records: {}, people: JSON.parse(JSON.stringify(APP_DATA.people)) };
}
function saveState() { cloudSave(); }

function getDateKey(d) { return d.toISOString().slice(0,10); }
function getMonthKey(d) { return d.toISOString().slice(0,7); }
let selectedDate = getDateKey(new Date());
function today() { return selectedDate; }
function now() { return new Date().toISOString(); }
function setDate(d) { selectedDate = d; updateDateDisplay(); render(); }
function updateDateDisplay() {
  const el = document.getElementById('currentDate');
  if (el) el.textContent = new Date(selectedDate + 'T00:00:00').toLocaleDateString('zh-CN', {year:'numeric',month:'long',day:'numeric',weekday:'long'});
  const input = document.getElementById('datePicker');
  if (input) input.value = selectedDate;
}
function getPeople() { return state.people; }
function getPersonLevel(name) { const p = getPeople().find(p => p.name === name); return p ? p.level : null; }
function getLevelBadge(level) {
  const cls = {'P0':'badge-p0','P1':'badge-p1','P2':'badge-p2','P3':'badge-p3','P4':'badge-p4'};
  return '<span class="badge '+cls[level]+'">'+level+'</span>';
}
function getScoreValue(scoreStr) {
  const s = scoreStr.trim().replace(/分(\/次)?$/,'')/*.replace(/\/条$/,'')*/.replace(/^\s*\+/,'');
  if (s.includes('/')) return parseFloat(s.split('/')[0]) || 0;
  return parseFloat(s) || 0;
}
function scoreClass(s) { if (s >= 95) return 'score-high'; if (s >= 75) return 'score-mid'; return 'score-low'; }
function fmtScore(n) {
  const v = Math.round(n * 10) / 10;
  return (v >= 0 ? '+' : '') + v.toFixed(1);
}
function fmtScorePlain(n) { return (Math.round(n * 10) / 10).toFixed(1); }

function getTodayRecords(name) {
  const dateKey = today();
  return (state.records[dateKey] && state.records[dateKey][name]) ? state.records[dateKey][name] : [];
}

function getTodayScoreDelta(name) {
  const records = getTodayRecords(name);
  let delta = 0;
  for (const r of records) {
    if (r.customScore != null) {
      delta += r.customScore * (r.count || 1);
    } else {
      const level = getPersonLevel(name);
      const items = level ? APP_DATA.levels[level]?.items : [];
      const item = items[r.itemIdx];
      if (item) delta += getScoreValue(item.score) * (r.count || 1);
    }
  }
  return delta;
}

function getTodayItemCount(name, itemIdx) {
  const records = getTodayRecords(name);
  let total = 0;
  for (const r of records) { if (r.itemIdx === itemIdx) total += (r.count || 1); }
  return total;
}

function addRecord(personName, itemIdx, count, evidence, customScore) {
  const dateKey = today();
  if (!state.records[dateKey]) state.records[dateKey] = {};
  if (!state.records[dateKey][personName]) state.records[dateKey][personName] = [];
  state.records[dateKey][personName].push({ itemIdx, count, evidence, time: now(), customScore: customScore || null });
  saveState();
}

function getMonthRecords(monthKey) {
  const result = {};
  for (const [date, persons] of Object.entries(state.records)) {
    if (date.slice(0,7) !== monthKey) continue;
    for (const [name, records] of Object.entries(persons)) {
      if (!result[name]) result[name] = [];
      result[name].push(...records.map(r => ({...r, date})));
    }
  }
  return result;
}

function calcMonthScore(name, monthKey) {
  const level = getPersonLevel(name);
  if (!level || !APP_DATA.levels[level]) return 100;
  const records = getMonthRecords(monthKey);
  const personRecords = records[name] || [];
  let total = 100;
  for (const r of personRecords) {
    if (r.customScore != null) {
      total += r.customScore * (r.count || 1);
    } else {
      const items = APP_DATA.levels[level]?.items;
      const item = items?.[r.itemIdx];
      if (item) total += getScoreValue(item.score) * (r.count || 1);
    }
  }
  return Math.max(0, total);
}

function getDayRecords(name, dateKey) {
  return (state.records[dateKey] && state.records[dateKey][name]) ? state.records[dateKey][name] : [];
}

function getDayScore(name, dateKey) {
  const level = getPersonLevel(name);
  if (!level || !APP_DATA.levels[level]) return 0;
  const records = getDayRecords(name, dateKey);
  let delta = 0;
  for (const r of records) {
    if (r.customScore != null) {
      delta += r.customScore * (r.count || 1);
    } else {
      const item = APP_DATA.levels[level]?.items?.[r.itemIdx];
      if (item) delta += getScoreValue(item.score) * (r.count || 1);
    }
  }
  return delta;
}

function getDaysInMonth(monthKey) {
  const [y, m] = monthKey.split('-').map(Number);
  const days = [];
  const lastDay = new Date(y, m, 0).getDate();
  for (let d = 1; d <= lastDay; d++) {
    const ds = d < 10 ? '0' + d : '' + d;
    days.push(monthKey + '-' + ds);
  }
  return days;
}

// -- Scoring actions --
function selectPerson(name) {
  selectedPerson = name;
  if (batchMode) { batchMode = false; batchSelected = []; }
  scoringSearch = '';
  scoringCatFilter = '全部';
  renderScoringArea();
}

function toggleBatch(on) {
  batchMode = on;
  if (!on) batchSelected = [];
  renderScoringArea();
}

function toggleBatchPerson(name, on) {
  if (on) { if (!batchSelected.includes(name)) batchSelected.push(name); }
  else { batchSelected = batchSelected.filter(n => n !== name); }
  renderScoringArea();
}

function setCatFilter(cat) {
  scoringCatFilter = cat;
  renderScoringArea();
}

function setSearch(q) {
  scoringSearch = q;
  renderScoringArea();
}

function renderScoringArea() {
  const main = document.getElementById('main');
  renderScoring(main);
}

function inputChanged(itemIdx) {
  const el = document.getElementById('val_' + itemIdx);
  const btn = document.getElementById('btn_' + itemIdx);
  if (!el) return;
  const val = parseFloat(el.value);

  el.classList.remove('positive', 'negative', 'zero', 'edited');
  btn.classList.remove('active-pos', 'active-neg');

  if (isNaN(val) || val === 0) {
    el.classList.add('zero');
    btn.textContent = '打分';
  } else if (val > 0) {
    el.classList.add('positive', 'edited');
    btn.classList.add('active-pos');
    btn.textContent = '加分';
  } else {
    el.classList.add('negative', 'edited');
    btn.classList.add('active-neg');
    btn.textContent = '扣分';
  }
}

function stepValue(itemIdx, delta) {
  const el = document.getElementById('val_' + itemIdx);
  if (!el) return;
  var v = parseFloat(el.value) || 0;
  v = Math.round((v + delta) * 10) / 10;
  el.value = v;
  inputChanged(itemIdx);
  el.focus();
}

function scoreManual(itemIdx) {
  const targets = batchMode && batchSelected.length > 0 ? batchSelected : (selectedPerson ? [selectedPerson] : []);
  if (targets.length === 0) return;

  const el = document.getElementById('val_' + itemIdx);
  const btn = document.getElementById('btn_' + itemIdx);
  if (!el) return;
  const val = parseFloat(el.value);
  if (isNaN(val) || val === 0) { el.focus(); el.select(); return; }

  const evidence = document.getElementById('evidenceInput')?.value || lastEvidence;

  for (const name of targets) {
    const lvl = getPersonLevel(name);
    if (!lvl || !APP_DATA.levels[lvl]) continue;
    addRecord(name, itemIdx, 1, evidence, val);
  }

  // Flash success animation on the scored row
  var row = el.closest('.scoring-item');
  if (row) {
    row.classList.add('flash-success');
    setTimeout(function(){ row.classList.remove('flash-success'); }, 700);
  }

  // Reset input
  el.value = 0;
  el.classList.remove('positive', 'negative', 'edited');
  el.classList.add('zero');
  btn.classList.remove('active-pos', 'active-neg');
  btn.textContent = '打分';

  // Toast feedback
  var label = fmtScore(val);
  showToast(targets.length > 1 ? ('已为 ' + targets.length + ' 人打分 ' + label) : ('打分成功 ' + label), val >= 0 ? 'success' : 'error');

  if (!batchMode && targets.length === 1) lastEvidence = evidence;
  renderScoringArea();
}

async function delRecord(dateKey, name, idx) {
  var ok = await showConfirm('确认删除这条记录？', '此操作不可恢复', '🗑️', '删除', 'btn-danger');
  if (!ok) return;
  state.records[dateKey][name].splice(idx, 1);
  if (state.records[dateKey][name].length === 0) delete state.records[dateKey][name];
  if (Object.keys(state.records[dateKey]).length === 0) delete state.records[dateKey];
  saveState();
  showToast('记录已删除', 'info');
  renderScoringArea();
}

function editRecord(dateKey, name, idx) {
  var r = state.records[dateKey][name][idx];
  var level = getPersonLevel(name);
  var items = APP_DATA.levels[level]?.items || [];
  var item = items[r.itemIdx];
  var currentScore = r.customScore != null ? r.customScore : (item ? getScoreValue(item.score) : 0);

  var html = '<h3>编辑记录 — ' + name + '</h3>'
    + '<p class="text-sm mb-md">' + (item ? item.standard : '?') + '</p>'

function saveEditRecord(dateKey, name, idx) {
  var r = state.records[dateKey][name][idx];

  var newCount = parseInt(document.getElementById('editCount').value) || 1;

// ====== SUMMARY PAGE ======
let summaryMonthOffset = 0;

function renderSummary(main) {
  const d = new Date();
  d.setMonth(d.getMonth() + summaryMonthOffset);
  const monthKey = getMonthKey(d);
  const people = getPeople();

  let html = '<div class="card"><div class="flex-between mb-md"><h3 style="border:none;padding:0;margin:0"><span style="font-size:16px">📊</span> 月度汇总</h3><div class="flex gap-sm"><button class="btn btn-outline btn-xs" onclick="changeMonth(-1)">◀</button><span style="font-weight:600;font-size:15px">'+d.getFullYear()+'年'+(d.getMonth()+1)+'月</span><button class="btn btn-outline btn-xs" onclick="changeMonth(1)">▶</button></div></div>';

  const scores = people.map(p => ({name: p.name, level: p.level, score: calcMonthScore(p.name, monthKey)}));
  const avg = scores.length > 0 ? (scores.reduce((a,b) => a + b.score, 0) / scores.length).toFixed(1) : 0;
  const max = scores.length > 0 ? Math.max(...scores.map(s => s.score)) : 0;
  const min = scores.length > 0 ? Math.min(...scores.map(s => s.score)) : 0;
  const over100 = scores.filter(s => s.score >= 100).length;

  html += '<div class="grid-4 mb-md">';
  html += '<div class="stat-card"><div class="number" style="color:var(--primary)">'+avg+'</div><div class="label">团队均分</div></div>';
  html += '<div class="stat-card"><div class="number" style="color:var(--success)">'+fmtScorePlain(max)+'</div><div class="label">最高分</div></div>';
  html += '<div class="stat-card"><div class="number" style="color:var(--danger)">'+fmtScorePlain(min)+'</div><div class="label">最低分</div></div>';
  html += '<div class="stat-card"><div class="number" style="color:var(--primary)">'+over100+'</div><div class="label">≥100分人数</div></div>';
  html += '</div>';

  html += renderTrendChart(monthKey);

  html += '<table><thead><tr><th>姓名</th><th>职级</th><th>打分次数</th><th>最终得分</th><th>等级</th><th>考核系数</th></tr></thead><tbody>';
  scores.sort((a,b) => b.score - a.score);
  for (const s of scores) {
    const recordCount = (getMonthRecords(monthKey)[s.name] || []).length;
    let grade, coefficient, gradeColor;
    if (s.score >= 110) { grade = 'S'; coefficient = '1.2'; gradeColor = '#e63946'; }
    else if (s.score >= 100) { grade = 'A'; coefficient = '1.0'; gradeColor = '#2a9d8f'; }
    else if (s.score >= 85) { grade = 'B'; coefficient = '0.9'; gradeColor = '#4361ee'; }
    else if (s.score >= 70) { grade = 'C'; coefficient = '0.7'; gradeColor = '#f4a261'; }
    else { grade = 'D'; coefficient = '0.5'; gradeColor = '#e63946'; }
    const width = Math.min(100, s.score);
    const barColor = s.score >= 95 ? 'var(--success)' : s.score >= 75 ? 'var(--warning)' : 'var(--danger)';
    html += '<tr>'
      + '<td><strong>'+s.name+'</strong></td>'
      + '<td>'+getLevelBadge(s.level)+'</td>'
      + '<td>'+recordCount+'次</td>'
      + '<td><span style="font-size:20px;font-weight:700;color:'+gradeColor+'">'+s.score.toFixed(1)+'</span>'
      + '<div class="progress-bar" style="margin-top:4px"><div class="fill" style="width:'+width+'%;background:'+barColor+'"></div></div></td>'
      + '<td><span class="badge" style="background:'+gradeColor+';color:#fff">'+grade+'</span></td>'
      + '<td style="font-weight:600">'+coefficient+'</td>'
      + '</tr>';
  }
  html += '</tbody></table>';
  html += '<div class="mt-md flex gap-sm"><button class="btn btn-outline btn-sm" onclick="showDetail(&quot;'+monthKey+'&quot;)">查看详细记录</button><button class="btn btn-sm" style="background:var(--success);color:#fff" onclick="exportCSV(&quot;'+monthKey+'&quot;)">导出CSV</button></div></div>';

  // Daily calendar matrix
  html += renderMonthCalendar(monthKey);

  main.innerHTML = html;
}

function changeMonth(delta) { summaryMonthOffset += delta; renderSummary(document.getElementById('main')); }

function renderTrendChart(monthKey) {
  const people = getPeople();
  const days = getDaysInMonth(monthKey);
  if (days.length === 0) return '';
  const W = 800, H = 220, PAD = {l:44,r:16,t:20,b:28};
  const w = W - PAD.l - PAD.r, h = H - PAD.t - PAD.b;
  let allScores = [];
  const data = people.map(p => {
    const arr = [];
    let running = 100;
    for (let i = 0; i < days.length; i++) {
      const dayDelta = getDayScore(p.name, days[i]);
      running += dayDelta;
      arr.push(running);
      allScores.push(running);
    }
    return {name: p.name, scores: arr};
  });
  if (allScores.length === 0) return '';
  let minY = Math.min(...allScores), maxY = Math.max(...allScores);
  if (minY === maxY) { minY -= 5; maxY += 5; }
  const padY = (maxY - minY) * 0.1;
  minY -= padY; maxY += padY;
  const colors = ['#4361ee','#e63946','#2a9d8f','#f4a261','#7b2d8b','#06b6d4','#ef476f','#8ac926','#ff9f1c','#3a86ff','#fb5607','#8338ec'];
  let svg = '<div class="card" style="margin-bottom:16px"><h3 style="border:none;padding-bottom:8px;margin-bottom:10px"><span style="font-size:16px">📈</span> 当月得分趋势</h3>';
  
  // Legend outside SVG, flex-wrap for readability
  svg += '<div style="display:flex;flex-wrap:wrap;gap:10px 18px;margin-bottom:12px;padding:0 4px">';
  for (let p = 0; p < data.length; p++) {
    svg += '<span style="display:inline-flex;align-items:center;font-size:13px;color:var(--text2);white-space:nowrap">';
    svg += '<span style="display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;background:'+colors[p % colors.length]+'"></span>';
    svg += data[p].name;
    svg += '</span>';
  }
  svg += '</div>';
  
  svg += '<div style="overflow-x:auto;-webkit-overflow-scrolling:touch"><svg viewBox="0 0 '+W+' '+H+'" style="width:100%;min-width:640px;height:'+H+'px;display:block">';
  svg += '<rect x="'+PAD.l+'" y="'+PAD.t+'" width="'+w+'" height="'+h+'" fill="none" stroke="var(--border)" rx="4"/>';
  for (let i = 0; i <= 4; i++) {
    const y = PAD.t + h * (i / 4);
    const val = (maxY - (maxY - minY) * (i / 4)).toFixed(0);
    svg += '<line x1="'+PAD.l+'" y1="'+y+'" x2="'+(PAD.l+w)+'" y2="'+y+'" stroke="#f0f2f5" stroke-width="1"/>';
    svg += '<text x="'+(PAD.l-6)+'" y="'+(y+4)+'" text-anchor="end" font-size="10" fill="var(--text3)">'+val+'</text>';
  }
  for (let i = 0; i < days.length; i += 5) {
    const x = PAD.l + (i / (days.length - 1)) * w;
    const dayNum = new Date(days[i]+'T00:00:00').getDate();
    svg += '<text x="'+x+'" y="'+(H - 8)+'" text-anchor="middle" font-size="9" fill="var(--text3)">'+dayNum+'日</text>';
  }
  for (let p = 0; p < data.length; p++) {
    const d = data[p];
    let path = '';
    for (let i = 0; i < d.scores.length; i++) {
      const x = PAD.l + (i / (days.length - 1)) * w;
      const y = PAD.t + h - ((d.scores[i] - minY) / (maxY - minY)) * h;
      path += (i === 0 ? 'M' : 'L') + x + ' ' + y;
    }
    svg += '<path d="'+path+'" fill="none" stroke="'+colors[p % colors.length]+'" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity=".85"/>';
    for (let i = 0; i < d.scores.length; i++) {
      const x = PAD.l + (i / (days.length - 1)) * w;
      const y = PAD.t + h - ((d.scores[i] - minY) / (maxY - minY)) * h;
      svg += '<circle cx="'+x+'" cy="'+y+'" r="2.5" fill="'+colors[p % colors.length]+'" opacity=".7"/>';
    }
  }
  svg += '</svg></div></div>';
  return svg;
}

function renderMonthCalendar(monthKey) {
  const people = getPeople();
  const days = getDaysInMonth(monthKey);
  const todayKey = getDateKey(new Date());
  const [y, m] = monthKey.split('-').map(Number);
  const monthLabel = y + '年' + m + '月';

  let html = '<div class="card" style="margin-top:16px"><div class="flex-between mb-md"><h3 style="border:none;padding:0;margin:0"><span style="font-size:16px">📅</span> 每日明细表</h3><span style="font-size:13px;color:var(--text2)">'+monthLabel+' · 点击有分数的日期查看详情</span></div>';
  html += '<div class="calendar-card"><table class="calendar-table"><thead><tr><th style="min-width:90px">姓名</th><th>职级</th>';
  for (const dateKey of days) {
    const day = new Date(dateKey + 'T00:00:00');
    const dayNum = day.getDate();
    const week = ['日','一','二','三','四','五','六'][day.getDay()];
    const isWeekend = day.getDay() === 0 || day.getDay() === 6;
    const isToday = dateKey === todayKey;
    html += '<th class="'+(isWeekend?'weekend ':'')+(isToday?'today-col ':'')+'"><div>'+dayNum+'日</div><div style="font-size:10px;font-weight:400">'+week+'</div></th>';
  }
  html += '<th>月总分</th></tr></thead><tbody>';

  for (const p of people) {
    const level = p.level;
    const items = APP_DATA.levels[level]?.items || [];
    const monthScore = calcMonthScore(p.name, monthKey);
    html += '<tr><th>'+p.name+'</th><td>'+getLevelBadge(level)+'</td>';
    for (const dateKey of days) {
      const day = new Date(dateKey + 'T00:00:00');
      const isWeekend = day.getDay() === 0 || day.getDay() === 6;
      const isToday = dateKey === todayKey;
      const records = getDayRecords(p.name, dateKey);
      const delta = getDayScore(p.name, dateKey);
      let cellClass = isWeekend ? 'weekend ' : '';
      if (isToday) cellClass += 'today-col ';
      let innerClass = 'day-cell empty';
      let display = '-';
      let title = monthLabel + day.getDate() + '日 ' + p.name + '\n暂无记录';
      if (records.length > 0) {
        innerClass = 'day-cell ' + (delta > 0 ? 'pos' : (delta < 0 ? 'neg' : 'zero'));
        display = fmtScore(delta);
        title = monthLabel + day.getDate() + '日 ' + p.name + '\n';
        for (const r of records) {
          const item = items[r.itemIdx];
          const scoreStr = r.customScore != null ? (r.customScore >= 0 ? '+' + r.customScore : '' + r.customScore) : (item ? item.score : '?');
          title += '• ' + (item ? item.category + ' / ' + item.standard : '?') + '：' + scoreStr + '\n';
        }
        title += '当日合计：' + (delta > 0 ? '+' : '') + delta;
      }
      html += '<td class="'+cellClass+'"><div class="'+innerClass+'" onclick="'+(records.length>0?'showDayDetail(&quot;'+p.name+'&quot;,&quot;'+dateKey+'&quot;)':'')+'" title="'+title.replace(/"/g,'&quot;')+'">'+display+'</div></td>';
    }
    html += '<td style="font-weight:700;color:'+(monthScore>=100?'var(--success)':(monthScore>=85?'var(--warning)':'var(--danger)'))+'">'+monthScore.toFixed(1)+'</td></tr>';
  }
  html += '</tbody></table></div></div>';
  return html;
}

function showDayDetail(name, dateKey) {
  const records = getDayRecords(name, dateKey);
  const level = getPersonLevel(name);
  const items = APP_DATA.levels[level]?.items || [];
  const d = new Date(dateKey + 'T00:00:00');
  const dateStr = d.toLocaleDateString('zh-CN', {year:'numeric',month:'long',day:'numeric',weekday:'long'});
  let html = '<h3>'+dateStr+' — '+name+'</h3>';

    html += '<div class="empty-state"><p>当日无记录</p></div>';

    html += '<table><thead><tr><th>考核项</th><th>标准</th><th>实际分值</th><th>次数</th><th>凭证</th></tr></thead><tbody>';

function closeModal(e) { if (e && e.target !== document.getElementById('modalOverlay')) return; document.getElementById('modalOverlay').style.display = 'none'; }

function exportCSV(monthKey) {
  const people = getPeople();
  let csv = '\uFEFF姓名,职级,打分次数,最终得分,等级,考核系数\n';
  for (const p of people) {
    const score = calcMonthScore(p.name, monthKey);
    const recordCount = (getMonthRecords(monthKey)[p.name] || []).length;
    let grade, coefficient;
    if (score >= 110) { grade = 'S'; coefficient = '1.2'; }
    else if (score >= 100) { grade = 'A'; coefficient = '1.0'; }
    else if (score >= 85) { grade = 'B'; coefficient = '0.9'; }
    else if (score >= 70) { grade = 'C'; coefficient = '0.7'; }
    else { grade = 'D'; coefficient = '0.5'; }
    csv += p.name+','+p.level+','+recordCount+','+score.toFixed(1)+','+grade+','+coefficient+'\n';
  }
  const blob = new Blob([csv], {type: 'text/csv;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = '绩效考核_'+monthKey+'.csv'; a.click();
  URL.revokeObjectURL(url);
}

function renderCriteria(main) {
  let html = '';
  for (const level of Object.keys(APP_DATA.levels)) {
    const data = APP_DATA.levels[level];
    if (!data) continue;
    const people = getPeople().filter(p => p.level === level).map(p => p.name).join('、');
    const displayLevel = level;
    html += '<div class="card"><h3 class="criteria-header" onclick="toggleCriteria(\''+level+'\')" id="criteriaHdr_'+level+'"><span class="collapse-arrow">▼</span><span style="font-size:16px">📐</span> '+displayLevel+'职级考核标准 <span class="text-sm">适用：'+(people||'无')+' — 点击展开/收起</span></h3>';
    html += '<div class="criteria-body" id="criteriaBody_'+level+'" style="max-height:2000px"><p class="text-sm mb-md">'+data.header+'</p>';
    const grouped = {};
    for (const item of data.items) { if (!grouped[item.category]) grouped[item.category] = []; grouped[item.category].push(item); }
    html += '<table><thead><tr><th>考核项目</th><th>考核内容</th><th>考核标准</th><th>加减分</th></tr></thead><tbody>';
    for (const [cat, items] of Object.entries(grouped)) {
      let first = true;
      for (const item of items) {
        html += '<tr><td>'+(first ? '<strong>'+cat+'</strong>' : '')+'</td><td>'+item.content+'</td><td>'+item.standard+'</td><td style="font-weight:600;color:'+(item.score.trim().startsWith('-')?'var(--danger)':'var(--success)')+'">'+item.score+'</td></tr>';
        first = false;
      }
    }
    html += '</tbody></table></div></div>';
  }
  main.innerHTML = html;
}

function toggleCriteria(level) {
  var body = document.getElementById('criteriaBody_' + level);
  var hdr = document.getElementById('criteriaHdr_' + level);
  if (!body || !hdr) return;
  if (body.classList.contains('collapsed')) {
    body.classList.remove('collapsed');
    body.style.maxHeight = body.scrollHeight + 'px';
    hdr.classList.remove('collapsed');
  } else {
    body.style.maxHeight = body.scrollHeight + 'px';
    body.offsetHeight;
    body.classList.add('collapsed');
    hdr.classList.add('collapsed');
  }
}

function addPerson() {
  const name = document.getElementById('newName').value.trim();
  const level = document.getElementById('newLevel').value;
  if (!name) return alert('请输入姓名');
  if (state.people.find(p => p.name === name)) return alert('该人员已存在');
  state.people.push({name, level, note: ''});
  saveState(); closeModal(); render();
}

async function deletePerson(name) {
  var ok = await showConfirm('确认删除 ' + name + ' 及其所有考核记录？', '此操作不可恢复！', '⚠️', '删除', 'btn-danger');
  if (!ok) return;
  state.people = state.people.filter(p => p.name !== name);
  for (const dateKey of Object.keys(state.records)) {
    if (state.records[dateKey][name]) delete state.records[dateKey][name];
    if (Object.keys(state.records[dateKey]).length === 0) delete state.records[dateKey];
  }
  showToast(name + ' 已删除', 'info');
  saveState(); render();
}

function changeLevel(name, newLevel) {
  const p = state.people.find(p => p.name === name);
  if (p) { p.level = newLevel; saveState(); }
}

async function resetAll() {
  var ok = await showConfirm('确认清空所有打分记录？', '人员信息保留，仅清空历史打分数据', '⚠️', '清空', 'btn-danger');
  if (!ok) return;
  ok = await showConfirm('再次确认：将清空所有历史打分数据', '此操作不可恢复！', '🔄', '确认清空', 'btn-danger');
  if (!ok) return;
  state.records = {};
  showToast('所有记录已清空', 'info');
  saveState(); render();
}

// ====== INIT ======
var _resizeTimer;
window.addEventListener('resize', function() {
  clearTimeout(_resizeTimer);
  _resizeTimer = setTimeout(function() {
    var header = document.querySelector('.header');
    if (header) {
      document.documentElement.style.setProperty('--header-height', header.offsetHeight + 'px');
    }
    updateTabIndicator();
  }, 150);
});
render(true);
</script>
